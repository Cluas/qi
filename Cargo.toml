[package]
name = "nsh-app-qi"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ureq = { version = "2.12", features = ["json"] }
