[package]
name = "qi-cloud"
version = "1.0.0"
edition = "2024"
description = "知气 Qi 官方零健康库极简控制面与无状态 ZDR AI 网关（支持 OpenHealthSync v2 E2EE 分片中继）"
license = "Apache-2.0"

[workspace]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "2.12", features = ["json"] }
